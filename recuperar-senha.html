<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | LOMBELLE</title>
  <meta name="description" content="Recupere o acesso à sua conta Lombelle.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f6f2ec">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/pages/login.css">
  <script type="module" src="js/pages/recuperar-senha.js"></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div class="auth-shell">
    <aside class="auth-hero" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?auto=format&fit=crop&w=1200&q=85" alt="" width="1200" height="900" fetchpriority="high" decoding="async">
      <div class="auth-hero-copy">
        <span class="brand"><span>LOMBELLE</span><small>LE PREMIER REGARD</small></span>
        <blockquote>O perfume é a forma mais intensa da lembrança.</blockquote>
      </div>
    </aside>
    <main class="auth-panel" id="conteudo" tabindex="-1" aria-label="Recuperar senha">
      <div class="auth-card">
        <a class="auth-back" href="index.html">← VOLTAR À LOJA</a>
        <h1 id="recTitle">Recuperar <em>senha</em></h1>
        <p class="auth-lead" id="recLead">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
        <form class="auth-form" id="requestForm" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error" aria-invalid="false">
          <p class="field-error" id="email-error"></p>
        </div>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <button class="button button-dark" id="submitBtn" type="submit">ENVIAR LINK</button>
          <p class="auth-foot"><a class="auth-link" href="login.html">Voltar ao login</a></p>
        </form>
        <form class="auth-form" id="resetForm" novalidate hidden>
        <div class="field">
          <label for="password">Nova senha</label>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error password-hint" aria-invalid="false"><button type="button" class="password-toggle" data-toggle-password="password" aria-pressed="false" aria-label="Mostrar ou ocultar nova senha">MOSTRAR</button></div>
          <p class="field-hint" id="password-hint">Mínimo de 10 caracteres, com maiúsculas, minúsculas e um número.</p>
          <p class="field-error" id="password-error"></p>
        </div>
        <div class="field">
          <label for="confirm">Confirmar nova senha</label>
          <div class="password-wrap"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="confirm-error" aria-invalid="false"><button type="button" class="password-toggle" data-toggle-password="confirm" aria-pressed="false" aria-label="Mostrar ou ocultar confirmar nova senha">MOSTRAR</button></div>

          <p class="field-error" id="confirm-error"></p>
        </div>
          <p class="auth-status" id="resetStatus" role="status" aria-live="polite"></p>
          <button class="button button-dark" id="resetBtn" type="submit">SALVAR NOVA SENHA</button>
        </form>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
