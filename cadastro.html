<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | LOMBELLE</title>
  <meta name="description" content="Crie sua conta Lombelle.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f6f2ec">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/pages/login.css">
  <script type="module" src="js/pages/cadastro.js"></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div class="auth-shell">
    <aside class="auth-hero" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?auto=format&fit=crop&w=1200&q=85" alt="" width="1200" height="900" fetchpriority="high" decoding="async">
      <div class="auth-hero-copy">
        <span class="brand"><span>LOMBELLE</span><small>LE PREMIER REGARD</small></span>
        <blockquote>O perfume é a forma mais intensa da lembrança.</blockquote>
      </div>
    </aside>
    <main class="auth-panel" id="conteudo" tabindex="-1" aria-label="Criar conta">
      <div class="auth-card">
        <a class="auth-back" href="index.html">← VOLTAR À LOJA</a>
        <h1>Criar <em>conta</em></h1>
        <p class="auth-lead">Leva menos de um minuto. Você receberá um e-mail para confirmar o cadastro.</p>
        <form class="auth-form" id="signupForm" novalidate>
          <div class="field">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required aria-describedby="name-error" aria-invalid="false">
            <p class="field-error" id="name-error"></p>
          </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error" aria-invalid="false">
          <p class="field-error" id="email-error"></p>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error password-hint" aria-invalid="false"><button type="button" class="password-toggle" data-toggle-password="password" aria-pressed="false" aria-label="Mostrar ou ocultar senha">MOSTRAR</button></div>
          <p class="field-hint" id="password-hint">Mínimo de 10 caracteres, com maiúsculas, minúsculas e um número.</p>
          <p class="field-error" id="password-error"></p>
        </div>
        <div class="field">
          <label for="confirm">Confirmar senha</label>
          <div class="password-wrap"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="confirm-error" aria-invalid="false"><button type="button" class="password-toggle" data-toggle-password="confirm" aria-pressed="false" aria-label="Mostrar ou ocultar confirmar senha">MOSTRAR</button></div>

          <p class="field-error" id="confirm-error"></p>
        </div>
          <label class="check"><input type="checkbox" id="newsletter" name="newsletter"><span>Quero receber novidades e lançamentos (opcional).</span></label>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <button class="button button-dark" id="submitBtn" type="submit">CRIAR CONTA</button>
          <p class="auth-foot">Já tem conta? <a class="auth-link" href="login.html">Entrar</a></p>
        </form>
        <div class="divider" aria-hidden="true">OU</div>
        <div class="social-row" id="socialRow"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
